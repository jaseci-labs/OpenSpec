name: Unpack the built CLI
description: >-
  Unpack the tree the build job laid out with neojac (the project as its node
  space emits it: Jac modules compiled to JavaScript beside the TypeScript
  forwarders) and install its npm packages with the job's own Node.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: laid-tree
    - name: Unpack and install
      shell: bash
      run: |
        # Forward slashes: on Windows the same path then works in bash, pwsh and Node.
        laid="${RUNNER_TEMP//\\//}/laid"
        mkdir -p "$laid"
        tar -xf laid-tree.tar -C "$laid"
        rm laid-tree.tar
        cd "$laid"
        npm ci --ignore-scripts
        echo "LAID=$laid" >> "$GITHUB_ENV"
