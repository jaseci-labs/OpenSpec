[npm."."]
name = "@fission-ai/openspec"
version = "2.2.0"
description = "AI-native system for spec-driven development"
keywords = ["openspec", "specs", "cli", "ai", "development"]
homepage = "https://github.com/Fission-AI/OpenSpec"
repository = { type = "git", url = "https://github.com/Fission-AI/OpenSpec" }
license = "MIT"
author = "FISSION AI INC"
type = "module"
packageManager = "pnpm@10.34.5"
publishConfig = { access = "public" }
exports = { "." = { types = "./dist/index.d.ts", default = "./dist/index.js" } }
bin = { openspec = "./bin/openspec.js" }
files = ["dist", "bin", "schemas", "src", "!dist/**/*.test.js", "!dist/**/__tests__", "!dist/**/*.map"]

[npm.".".scripts]
lint = "eslint src/"
build = "node build.js"
"generate:skills" = "node scripts/generate-skillssh.mjs"
"regen:parity-hashes" = "node scripts/regen-parity-hashes.mjs"
dev = "tsc --watch"
"dev:cli" = "pnpm build && node bin/openspec.js"
test = "node -e \"fs.mkdirSync('.git',{recursive:true})\" && node build.js && vitest run"
"test:watch" = "vitest"
"test:ui" = "vitest --ui"
"test:coverage" = "vitest --coverage"
prepare = "node build.js"
prepublishOnly = "pnpm run build"
"check:pack-version" = "node scripts/pack-version-check.mjs"
release = "pnpm run release:ci"
"release:ci" = "pnpm run check:pack-version && pnpm exec changeset publish"
changeset = "changeset"

[npm.".".engines]
node = ">=22.20.0"

[npm.".".devDependencies]
"@changesets/changelog-github" = "^1.0.0"
"@changesets/cli" = "^3.0.1"
"@types/node" = "^22.12.0"
"@types/picomatch" = "^4.0.3"
"@vitest/ui" = "^5.0.3"
eslint = "^10.5.0"
smol-toml = "^1.7.1"
typescript = "^6.0.3"
typescript-eslint = "^8.65.0"
vite = "^8.3.5"
vitest = "^5.0.3"

[npm.".".dependencies]
"@inquirer/core" = "^12.0.0"
"@inquirer/prompts" = "^8.5.2"
brace-expansion = "^5.0.12"
chalk = "^6.0.1"
commander = "^14.0.0"
cross-spawn = "7.0.6"
diff = "^9.0.0"
ora = "^9.4.1"
picomatch = "^4.0.4"
skills = "1.8.1"
tinyglobby = "^0.2.17"
yaml = "^2.8.3"
zod = "^4.4.3"

[test.npm."."]
script = "test"

[project]
exclude = ["website", "dist"]

[check.lint]
ignore = ["separate-impls"]
